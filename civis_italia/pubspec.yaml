name: civis_italia
description: Assistente personale per la burocrazia italiana.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Scanner nativo: VisionKit su iOS, ML Kit Document Scanner su Android
  cunning_document_scanner: ^1.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pdf: ^3.11.0
  image: ^4.2.0
  # Collegamento al server su Cloudflare
  http: ^1.2.0
  # Token di accesso, conservato in modo cifrato dal sistema
  flutter_secure_storage: ^9.2.2
  # Apre i siti ufficiali indicati nell'analisi
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1F4FD8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
