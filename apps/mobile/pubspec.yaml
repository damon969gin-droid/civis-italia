name: civis_italia
description: Civis Italia - Assistente personale intelligente per la burocrazia italiana
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.2.0
  # Camera & media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  # Network
  dio: ^5.5.0+1
  # Local storage & security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  # UI
  google_fonts: ^6.2.1
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/
